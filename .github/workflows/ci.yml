name: CI

on:
  push:
    branches-ignore:
      - 'renovate/**'
      - 'dependabot/**'
  pull_request:

permissions:
  contents: read

# Port note: CircleCI's applicable jobs run on GitHub Actions for this Solid port.
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  test_lint:
    name: Linting
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check . --ignore-path .lintignore
      - run: pnpm eslint:ci
      - run: pnpm stylelint

  test_types:
    name: Typechecking
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typescript
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  test_unit:
    name: JSDOM tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests on JSDOM
        run: pnpm test:jsdom --run --silent=false

  test_browser:
    name: Browser tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run tests on headless Chromium
        run: pnpm test:chromium --run --silent=false

  upstream_parity:
    name: Upstream parity
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Port note: compareUpstreamTests needs the tracked React reference checkout.
      - name: Read upstream commit
        id: upstream
        run: |
          upstream_commit=$(sed -n 's/^- Ported from upstream commit: `\([0-9a-f]\{40\}\)`.*/\1/p' UPSTREAM.md)
          test "${#upstream_commit}" -eq 40
          echo "commit=$upstream_commit" >> "$GITHUB_OUTPUT"
      - name: Checkout upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mui/base-ui
          ref: ${{ steps.upstream.outputs.commit }}
          path: .upstream/base-ui
          persist-credentials: false
      - run: pnpm test:compare-upstream .upstream/base-ui

  docs_validate:
    name: Validating Docs
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Port note: this repo validates and builds its Solid Vite docs directly.
      - run: pnpm --filter docs validate
      - run: pnpm --filter docs build
