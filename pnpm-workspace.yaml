packages:
  - packages/*
  - playground
  - docs
  - test

allowBuilds:
  esbuild: true
  unrs-resolver: true

engineStrict: true
updateNotifier: false
autoDedupe: true
minimumReleaseAgeExclude:
  - '@solidjs/babel-plugin@2.0.0-rc.21'
  - '@solidjs/signals@2.0.0-rc.21'
  - '@solidjs/web@2.0.0-rc.21'
  - solid-js@2.0.0-rc.21
